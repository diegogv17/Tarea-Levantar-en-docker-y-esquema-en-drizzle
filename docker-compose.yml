services:
  db:
    image: postgres:17-alpine
    container_name: tarea_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tarea}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tarea}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
